# 路径
# 日记原文根目录请写在下方 extract.root（任意盘符，不必在 data/ 下）
# extract.root 优先于 .env 的 DIARY_DIR；二者都空才用 data.diary_dir
data:
  diary_dir: "data/diary"   # 仅当 extract.root 与 DIARY_DIR 都留空时的回退
  db_path: "data/diary.db"
  chroma_dir: "data/chroma"

# 中研院日记语料（scripts/import_sinica.py）
# 也可用环境变量 SINICA_CORPUS_PATH / SINICA_AUTHOR
sinica:
  corpus_csv: "../sinica_ith_diary_corpus/diary_corpus.csv"
  author: "楊基振日記"   # 留空表示导出全部作者；首次建议先单人试跑

# 切块（本地）
chunking:
  max_chars: 500
  overlap_chars: 50

# 嵌入（本地 sentence-transformers）
embedding:
  model: "BAAI/bge-small-zh-v1.5"
  batch_size: 32

# 检索（Engine Plan / 命名方案；参数可用环境变量覆盖）
retrieval:
  # 最终进入 Context 的 chunk 数（多主题 embedding 并集后截断）
  top_k: 5
  # 默认：仅多主题 Embedding（Query Agent 产出 1~3 主题，分别 ANN 再并集）
  scheme: "embedding_only"
  plan: ["embedding"]
  w_vector: 0.5             # 加权方案中的 embedding 权重（与 schemes 可分别覆盖）
  w_tag: 0.5
  schemes:
    weighted_50_50:
      label: "Tag + Sentence 加权 (0.5/0.5)"
      description: "Tag 展开 sentence + rag-sentence 向量加权"
      operators: ["tag", "embedding"]
      merge: "weighted"
      w_tag: 0.5
      w_embedding: 0.5
    union_max:
      label: "并集取 max"
      description: "顺序执行，同分取较大值"
      operators: ["tag", "embedding"]
      merge: "max"
    tag_only:
      label: "仅 Tag"
      operators: ["tag"]
      merge: "max"
    embedding_only:
      label: "仅多主题 Sentence 向量"
      description: "每个改写主题分别 ANN，并集 max，再按 chunk 取 top_k"
      operators: ["embedding"]
      merge: "max"
  save_json: true           # 每次召回写入 JSON，便于审阅
  log_path: "data/last_retrieval.json"
  history_dir: "data/retrieval_runs"  # 同时按时间戳留一份；空则不留历史
  tag_score:
    # tag_score = entity_weight * n_entity + entity_hit_bonus*(n_entity>0)
    #           + keyword_weight * n_keyword   （或 Σ tfidf，见 use_keyword_tfidf）
    entity_weight: 10.0     # 每个重合实体加分（应远大于 keyword）
    keyword_weight: 1.0     # 每个重合关键词加分
    entity_hit_bonus: 5.0   # 只要有任意实体重合再额外加
    use_keyword_tfidf: false  # true 时用 chunk_term.weight 累加代替纯个数
    min_score: 0.0
    top_k: 50               # TagOperator 召回上限

# Context Engine（会话短期记忆 = 滑动窗口 + 溢出摘要 + 窗口内曾召回 chunk）
context:
  system_prompt: |
    你是用户的陪伴型助手：可以闲聊生活、想法与日常，也可以在有日记材料时帮忙回忆往事。

    系统有时会附上检索到的日记原文，以及「命中理由」（匹配到的改写句子）。有材料时自然融入回答；没有材料时照常陪聊，不要拒答。

    抽象结论需有原文或命中理由支撑。仅在用户明确追问日记且材料不足时说明查无——仍可继续聊，别硬编。
  # 会话内短期记忆：滑动窗口保留最近 N 轮（一轮 ≈ user+assistant，即最多 2N 条消息）
  session_window_turns: 10
  recent_message_turns: 10   # 兼容旧键；优先读 session_window_turns
  # 是否把近 N 轮 retrieval_traces 里的 chunk 一并塞进 Prompt（与窗口对齐）
  include_prior_retrievals: true
  total_token_budget: 8000
  budget:
    system: 0.10
    summary: 0.15
    recent: 0.25
    memories: 0.40
    query: 0.10
  memory_min_score: 0.0
  memory_max_items: 20
  # 超出窗口后：默认每有新溢出就 LLM 摘要；>1 时先用短摘录顶住，攒满 N 条再压缩
  summarize_every_messages: 1
  save_debug_json: true
  debug_path: "data/last_context.json"

# Query Agent：mode=react 时先分析再调 grep/rag；rewrite 为旧主题改写
query_agent:
  enabled: true
  mode: "react"          # react | rewrite
  llm_role: "tags"
  max_themes: 3
  max_tool_steps: 4
  save_debug_json: true
  debug_path: "data/last_query.json"
  tools:
    grep:
      top_k: 20
    rag_search:
      top_k: 5
      default_scheme: "embedding_only"
# Paraphrase / rag-sentence（v0.4：检索基元）
paraphrase:
  max_sentences_per_chunk: 30
  model_version: "rag-sentence-v1"
  chroma_collection: "diary_sentences"
  llm_role: "tags"

# Memory Views（v0.3 已退役，保留配置仅兼容旧数据）
memory_views:
  deprecated: true
  max_views_per_chunk: 6
  model_version: "v0.3"
  chroma_collection: "diary_views"

# v0.1 分词与实体（src/tokenize.py）
tokenize:
  stopwords_file: "data/stopwords_zh.txt"

# 词表 / 停用词库（JSON/txt 仍保留供人审；DB 供查询与增补）
# backend: sqlite（默认 data/lexicon.db）| postgres（需 LEXICON_DATABASE_URL）
lexicon:
  db:
    backend: "sqlite"
    sqlite_path: "data/lexicon.db"
    # database_url: ""   # 或用环境变量 LEXICON_DATABASE_URL / DATABASE_URL

# v0.1 候选词表 V（scripts/build_vocabulary.py）
# 环境变量可覆盖：VOCAB_SIZE, VOCAB_MIN_DF_RATIO, VOCAB_MAX_DF_RATIO,
# VOCAB_MIN_DF_ABS, VOCAB_MIN_TOTAL_TF, VOCAB_SORT_BY, VOCAB_OUTPUT_PATH 等
vocabulary:
  vocab_size: 5000
  min_df_ratio: 0.03        # 至少 3% chunk（略收紧，减少偶发词）
  max_df_ratio: 0.50        # >50% chunk 视为过泛（原 0.80 太松）
  min_df_abs: 3
  min_total_tf: 3
  min_token_len: 2
  max_token_len: 12
  exclude_single_char: true
  sort_by: "tf_idf"
  output_path: "data/vocabulary.json"
  entities_output_path: "data/entities.json"  # 全局：由 chunk 实体合并
  chunk_entities_output: "data/chunk_entities.json"
  entity_sample_ratio: 1.0    # 试跑可设 0.05；或环境变量 ENTITY_SAMPLE_RATIO
  # 实体清洗：规则去粘连 + 轻量 LLM（seed-flash）
  entity_review:
    enabled: true
    llm_role: "tags"
    batch_size: 40
    apply_rule_filters: true
  exclude_entity_terms: true
  keywords_per_chunk: 20      # 每 chunk TF-IDF Top-K（仅 V 内词）
  chunk_keywords_output: "data/chunk_keywords.json"
  keywords_min_weight: 0.0
  # 建表后轻量 LLM 评估 → 无意义词追加到 stopwords_zh.txt（自学习）
  review:
    enabled: true
    llm_role: "tags"        # 用 seed-1.6-flash，成本低
    batch_size: 40
    rebuild_after_learn: true
    append_stopwords: true
    apply_rule_filters: true  # 时间点/泛称谓规则预过滤

# LLM：标签提取 / 回答生成 可分开配置
# api_key 留空或填 env → 从环境变量 api_key_env 读取（建议写在 .env）
llm:
  tags:
    provider: "openrouter"
    # 豆包/Seed：批量标签用更快更便宜的
    model: "qwen/qwen3-max-thinking"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "env"
    api_key_env: "OPENROUTER_API_KEY"
    http_referer: "https://github.com/James-I-2005/Diary-rag-system"
    x_title: "Personal Diary RAG"
  answer:
    provider: "openrouter"
    # 豆包/Seed：问答用通用版
    model: "qwen/qwen3-max-thinking"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "env"
    api_key_env: "OPENROUTER_API_KEY"
    http_referer: "https://github.com/James-I-2005/Diary-rag-system"
    x_title: "Personal Diary RAG"

# 日历洞察：整月词云（无 LLM）+ 日总结/诗句（轻量 Agent，本地缓存）
day_insights:
  llm_role: "tags"
  wordcloud_top_n: 60
  month_wordcloud_top_n: 80
  cache_dir: "data/day_insights"

# 日记格式（正文切分还会内置识别 2026.7.3 / 2026年7月3日 / 3.7.2026 等变体）
diary:
  date_pattern: "^# (\\d{4}-\\d{2}-\\d{2})"

# 目录 Extract → Manifest（见 doc/version0.4/05-extract-pipeline.md）
# 级联：path 正则 →（可选 --agent）路径 Agent → 正文正则 → mtime
extract:
  # 日记原文根目录：递归扫此目录建 Manifest / 入库。可写绝对路径，例如：
  # root: "D:/Notes/my-diary"
  # root: "C:/Users/you/Documents/日记"
  # 留空则回退到 DIARY_DIR，再回退 data.diary_dir
  root: "D:/temp/week1"
  extensions: [".md", ".txt", ".docx"]
  agent_batch_size: 40   # 轻量路径 Agent 每批路径数
  llm_role: "tags"
  manifest_path: "data/extract_manifest.json"
